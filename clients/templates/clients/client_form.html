{% extends 'clients/base.html' %}
{% block title %}
{% if client %}Редактирование клиента{% else %}Создание клиента{% endif %}
{% endblock %}
{% block content %}
<h1>{% if client %}Редактирование клиента{% else %}Новый клиент{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'client_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
